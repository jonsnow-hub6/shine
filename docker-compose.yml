services:

  backend:
    build:
      context: ./apps/backend

    ports:
      - "8090:8090"

    volumes:
      - ./apps/backend/pb_data:/pb/pb_data
      - ./apps/backend/pb_hooks:/pb/pb_hooks


  frontend:
    build:
      context: .

      dockerfile: apps/frontend/Dockerfile

    ports:
      - "3000:80"

    environment:
      VITE_POCKETBASE_URL: http://pocketbase:8090

    depends_on:
      - backend
